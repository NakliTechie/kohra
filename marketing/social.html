<!doctype html>
<!-- Source for social.png (1280×640): the repo social preview, the README hero and the app's og:image.
     Re-render: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars
       --window-size=1280,640 --screenshot=marketing/social.png marketing/social.html -->
<meta charset="utf-8">
<style>
  :root { --fg:#e8e6e3; --bg:#14161a; --dim:#8a8f98; --acc:#7aa2f7; --mask:#3b4261; --fresh:#9ece6a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: Menlo, ui-monospace, monospace; }
  .card { display: grid; grid-template-columns: 520px 1fr; gap: 56px; padding: 72px 72px; height: 100%; align-items: center; }
  h1 { font-size: 104px; font-weight: 700; letter-spacing: -2px; color: var(--fg); }
  h1 span { color: var(--acc); }
  .dev { font-size: 30px; color: var(--dim); margin-top: 6px; }
  .line { font-size: 34px; line-height: 1.3; margin-top: 40px; }
  .line b { color: var(--fresh); font-weight: 400; }
  .meta { font-size: 20px; color: var(--dim); margin-top: 32px; }
  .canvas { background: #1b1e25; border: 1px solid #2a2e37; border-radius: 16px; padding: 28px 30px;
    font-size: 23px; line-height: 2.05; }
  .canvas .t { color: var(--fg); }
  .canvas .f { color: var(--fresh); }
  .canvas .m { display: inline-block; width: 1.9em; height: 0.95em; vertical-align: -2px; border-radius: 4px;
    background: var(--mask); margin: 0 3px; }
  .steps { display: flex; justify-content: space-between; margin-top: 18px; font-size: 16px; color: var(--dim); }
</style>
<div class="card">
  <div>
    <h1>k<span>o</span>hra</h1>
    <div class="dev">कोहरा · fog</div>
    <div class="line">Text diffusion,<br><b>generated in your browser.</b></div>
    <div class="meta">WebGPU · one JS file · no server</div>
  </div>
  <div>
    <div class="canvas">
      <span class="t">The sky appears</span> <span class="m"></span> <span class="t">because</span> <span class="f">sunlight</span>
      <span class="m"></span> <span class="m"></span> <span class="t">scattered</span> <span class="m"></span>
      <span class="t">the atmosphere.</span> <span class="m"></span> <span class="f">Blue</span> <span class="t">light</span>
      <span class="m"></span> <span class="m"></span> <span class="t">shorter</span> <span class="m"></span>
      <span class="m"></span> <span class="m"></span> <span class="f">so</span> <span class="t">it</span>
      <span class="m"></span> <span class="m"></span> <span class="m"></span> <span class="m"></span>
      <span class="m"></span> <span class="m"></span> <span class="m"></span> <span class="m"></span>
    </div>
    <div class="steps"><span>block 2/4 · forward 41</span><span>masked → clear, pass by pass</span></div>
  </div>
</div>
